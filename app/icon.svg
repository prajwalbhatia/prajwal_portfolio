<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Prajwal Bhatia">
  <!-- Plate stays dark on purpose: a light plate disappears into a light tab
       strip. Bars are lifted tints of --color-was / --color-accent, because
       the token values themselves (#b4471c, #5b4bd6) are too dark to read
       against this plate. -->
  <rect width="32" height="32" rx="5" fill="#17171a"/>
  <rect x="7" y="9"  width="13" height="4" rx="1" fill="#e07a4a"/>
  <rect x="7" y="19" width="18" height="4" rx="1" fill="#8b7bf0"/>
</svg>
